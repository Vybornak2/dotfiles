general.import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[window]
padding = { x = 6, y = 6 }
dynamic_padding = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 12.0

[selection]
save_to_clipboard = true

[terminal]
shell = { program = "/usr/bin/zsh", args = ["-l"] }
